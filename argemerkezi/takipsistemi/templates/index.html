{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-GE</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Örnek stil tanımlamaları */
        body {
            font-family: "Times New Roman", serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0b335c;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Yeni stil tanımlamaları */
        .welcome-section {
            text-align: center;
            padding: 100px 0 40px;
            background-color: #06223f; /* Dar blue olarak güncellendi */
            color: #fff;
            position: relative;
        }

        .welcome-heading {
            font-size: 48px; /* Daha büyük font boyutu */
            font-family: "Times New Roman", serif; /* Times New Roman yazı stili */
            margin-bottom: 20px;
        }

        .button-primary {
            background-color: #961c18; /* Koyu kırmızı olarak güncellendi */
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-right: 10px;
        }

        .button-secondary {
            background-color: #961c18; /* Koyu kırmızı olarak güncellendi */
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        /* Diğer stil tanımlamalarını buraya ekleyebilirsiniz */

        .footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        /* Logo düzenlemeleri */
        .logo-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .logo {
            width: 100px; /* Logoların boyutu */
        }

        .arge-logo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .logo-left {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        
        .logo-right {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <div class="logo-section">
                <div class="logo logo-left">
                    <img src="{% static 'fernas_logo.png' %}" alt="FERNAS Group">
                </div>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'hakkimizda' %}">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tamamlanan_projeler' %}">Projeler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'kadro' %}">Kadro</a>
                    </li>
                </ul>
            </div>
            <div class="logo-section">
                <div class="logo logo-right">
                    <img src="{% static 'allalci_logo.jpg' %}" alt="Allalci Logo">
                </div>
            </div>
        </div>
    </nav>

    <section class="welcome-section">
        <div class="container">
            <div class="arge-logo">
                <img src="{% static 'arge_logo.png' %}" alt="ARGE Logo">
            </div>
            <h1 class="welcome-heading">AR&nbsp;GE&nbsp;Merkezi<br>Proje Sistemi</h1>
            <a href="{% url 'login' %}" class="button-primary">Giriş Yap</a>
            <a href="{% url 'register' %}" class="button-secondary">Kayıt Ol</a>
        </div>
    </section>

    <section class="container">
        <!-- Diğer içerikler burada devam eder -->
    </section>

    <footer class="footer">
        &copy; {{ year }} ARGEMPS. Tüm hakları saklıdır.
    </footer>

    <!-- Bootstrap JS ve popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
