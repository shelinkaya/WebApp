<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .error-message {
            color: red;
            margin-top: 5px;
        }

        .success-message {
            color: green;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Kayıt Ol</h2>
        <!-- Kayıt başarılı mesajı -->
        {% if messages %}
            {% for message in messages %}
                <p class="success-message">{{ message }}</p>
            {% endfor %}
        {% endif %}
            <!-- Kayıt hata mesajı -->
        {% if error_messages %}
            {% for message in error_messages %}
                <p class="error-message">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="first_name">Ad:</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Soyad:</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="username">Kullanıcı Adı:</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">E-posta:</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Şifre:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password_repeat">Şifre (Tekrar):</label>
                <input type="password" name="password_repeat" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="birth_date">Doğum Tarihi:</label>
                <input type="date" name="birth_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="gender">Cinsiyet:</label>
                <select name="gender" class="form-control" required>
                    <option value="male">Erkek</option>
                    <option value="female">Kadın</option>
                    <option value="other">Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="contact_info">İletişim Bilgileri:</label>
                <input type="text" name="contact_info" class="form-control" required>
            </div>
            
            
            <div class="form-group">
                <label for="occupation">Meslek / Pozisyon:</label>
                <input type="text" name="occupation" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="expertise">Uzmanlık Alanları:</label>
                <input type="text" name="expertise" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="bio">Kısa Biyografi:</label>
                <textarea name="bio" class="form-control" rows="4" required></textarea>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" name="accept_terms" class="form-check-input" required>
                <label class="form-check-label">
                    <a href="{% url 'gizlilik_politikasi' %}" target="_blank">Kullanım Koşullarını ve Gizlilik Politikasını Kabul Ediyorum</a>
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Kayıt Ol</button>
        </form>
        <p class="text-center mt-3">Zaten hesabınız var mı? <a href="{% url 'login' %}">Giriş yapın</a></p>
    </div>
</body>
</html>
