<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argemerkezi - Ana Sayfa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Örnek stil tanımlamaları */
        body {
            font-family: "Times New Roman", serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0b335c;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Yeni stil tanımlamaları */
        .welcome-section {
            text-align: center;
            padding: 50px 0;
            background-color: #0b335c; /* Dar blue olarak güncellendi */
            color: #fff;
        }

        .welcome-heading {
            font-size: 48px; /* Daha büyük font boyutu */
            font-family: "Times New Roman", serif; /* Times New Roman yazı stili */
            margin-bottom: 20px;
        }

        .button-primary {
            background-color: #961c18; /* Koyu kırmızı olarak güncellendi */
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-right: 10px;
        }

        .button-secondary {
            background-color: #961c18; /* Koyu kırmızı olarak güncellendi */
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        /* Diğer stil tanımlamalarını buraya ekleyebilirsiniz */

        .footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">Argemerkezi</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Projeler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Giriş Yap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="welcome-section">
        <div class="container">
            <h1 class="welcome-heading">ARGE Merkezi Proje Sistemi'ne Hoşgeldiniz</h1>
            <a href="{% url 'login' %}" class="button-primary">Giriş Yap</a>
            <a href="{% url 'register' %}" class="button-secondary">Kayıt Ol</a>
        </div>
    </section>

    <section class="container">
        <!-- Diğer içerikler burada devam eder -->
    </section>

    <footer class="footer">
        &copy; 2023 ARGEMPS. Tüm hakları saklıdır.
    </footer>

    <!-- Bootstrap JS ve popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
